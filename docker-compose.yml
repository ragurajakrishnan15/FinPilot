# Local PostgreSQL for development only. Credentials are throwaway local values.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: finpilot
      POSTGRES_PASSWORD: finpilot
      POSTGRES_DB: finpilot
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finpilot']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
