# Render blueprint for the Haskell API. It pulls the image that .github/workflows/publish-api.yml builds
# and publishes, so nothing is compiled on Render. Secrets are set in the Render dashboard, never committed.
services:
  - type: web
    name: finpilot-api
    runtime: image
    image:
      url: ghcr.io/ragurajakrishnan15/finpilot-api:latest # the package must be public for Render to pull it without credentials
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: 'true' # public portfolio demo only; synthetic data. Set false if real users ever exist.
      - key: DATABASE_URL
        sync: false # Supabase session-pooler connection string, with ?sslmode=require
      - key: JWT_SECRET
        sync: false # 32+ random characters
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the deployed Vercel origin, e.g. https://finpilot.vercel.app (no trailing slash)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false # openai/gpt-oss-120b (confirm the current model in the Groq console)
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_TIMEOUT_SECONDS
        value: '30'
      - key: MAX_TOOL_CALLS_PER_TURN
        value: '5'
      - key: MAX_COMMAND_INPUT_CHARS
        value: '4000'
